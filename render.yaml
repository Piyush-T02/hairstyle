services:
  - type: web
    name: trakky-ai-salon
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn trakky_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
